apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
# Flux ships NetworkPolicies that flip Cilium to enforce-on. Cilium then
# blocks those pods from kube-apiserver (EPERM to 10.96.0.1:443).
# Lab: drop the policies. Revisit with CiliumNetworkPolicy later.
patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: unused

