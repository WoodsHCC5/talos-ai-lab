# Week 2. Monitoring + data plane. Waits for infra (storage, cert-manager).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-platform
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 15m
  prune: true
  wait: true
  dependsOn:
    - name: infra
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/platform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: lab-config
        optional: true
