# Week 3. Leave suspended until vLLM should own the 3090.
#   make unsuspend-inference && git commit && git push
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-inference
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 20m
  prune: true
  wait: false
  suspend: true
  dependsOn:
    - name: apps-platform
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/inference
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: lab-config
        optional: true
