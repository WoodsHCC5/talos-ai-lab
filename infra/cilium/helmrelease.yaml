# Adopts the release created by hack/bootstrap-cilium.sh (same name + namespace).
# Values match the official Talos Cilium guide (kube-proxy-free + Gateway API)
# plus Hubble and L2 announcements for a single-node homelab.
# https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: cilium
      version: "1.18.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    gatewayAPI:
      enabled: true
      enableAlpn: true
      enableAppProtocol: true
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
    # Without this, pods get EPERM connecting to kubernetes ClusterIP
    # (10.96.0.1:443) under kube-proxy replacement. Flux then crashloops.
    socketLB:
      hostNamespaceOnly: true
    l2announcements:
      enabled: true
    externalIPs:
      enabled: true
    k8sClientRateLimit:
      qps: 50
      burst: 100
    operator:
      replicas: 1
