# Two 4 TB NVMe disks.
#
#   NVMe 1 = INSTALL_DISK (system_disk)
#     EPHEMERAL capped at 1 TB (containerd, kubelet)
#     leftover ~3 TB → user volume local-path  (/var/mnt/local-path)
#   NVMe 2 = DISK_SERIAL_MODELS
#     entire disk → user volume models         (/var/mnt/models)
#
# generate.sh substitutes DISK_SERIAL_MODELS from lab.env.
# Discover serials:
#   talosctl -n $CONTROL_PLANE_IP get disks -o yaml
#
# Do not select the models disk by /dev/nvme1n1 — names move across reboots.
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  minSize: 100GB
  maxSize: 1TB
  grow: false
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-path
provisioning:
  diskSelector:
    match: system_disk
  minSize: 200GB
  grow: true
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: models
provisioning:
  diskSelector:
    match: disk.serial == '${DISK_SERIAL_MODELS}'
  minSize: 200GB
  grow: true
