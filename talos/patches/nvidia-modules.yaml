# Load the proprietary NVIDIA modules that the Factory extensions placed on disk.
# Apply to any node that has the 3090.
#
# Confirm:
#   talosctl -n $CONTROL_PLANE_IP read /proc/modules | grep nvidia
#   talosctl -n $CONTROL_PLANE_IP read /proc/driver/nvidia/version
#   talosctl -n $CONTROL_PLANE_IP get extensions
machine:
  kernel:
    modules:
      - name: nvidia
      - name: nvidia_uvm
      - name: nvidia_drm
      - name: nvidia_modeset
  sysctls:
    # Required on some Talos + Cilium + NVIDIA combinations.
    net.core.bpf_jit_harden: "1"
  # Takes effect on next upgrade/reboot. Stops the 10980XE entering C6/C7
  # and the 3090's PCIe link from parking. BIOS 1.30 ships old microcode
  # and that combination hard-freezes the box. Flash 7B96v14 as well.
  install:
    extraKernelArgs:
      - intel_idle.max_cstate=1
      - processor.max_cstate=1
      - pcie_aspm=off
