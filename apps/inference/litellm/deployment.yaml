# Single front door. Humans (Open WebUI) and agents (kagent) both talk here.
# Add a cloud provider later as a fallback model without changing clients.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm
  namespace: inference
data:
  config.yaml: |
    model_list:
      - model_name: lab
        litellm_params:
          model: openai/Qwen/Qwen2.5-7B-Instruct-AWQ
          api_base: http://vllm.inference.svc.cluster.local:8000/v1
          api_key: sk-local
      # After you swap vLLM to a 32B, change both model strings to match.
      # - model_name: lab-32b
      #   litellm_params:
      #     model: openai/Qwen/Qwen2.5-32B-Instruct-AWQ
      #     api_base: http://vllm.inference.svc.cluster.local:8000/v1
      #     api_key: sk-local
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    litellm_settings:
      drop_params: true
      request_timeout: 600
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: inference
spec:
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          env:
            - name: LITELLM_MASTER_KEY
              value: sk-lab
          ports:
            - containerPort: 4000
              name: http
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: litellm
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  namespace: inference
spec:
  parentRefs:
    - name: lab
      namespace: kube-system
  hostnames:
    - llm.lab.home.arpa
  rules:
    - backendRefs:
        - name: litellm
          port: 4000
