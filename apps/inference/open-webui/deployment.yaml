# Human chat. Talks to LiteLLM, never to the GPU pod directly.
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: webui
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:0.6.18
          env:
            - name: OPENAI_API_BASE_URL
              value: http://litellm.inference.svc.cluster.local:4000/v1
            - name: OPENAI_API_KEY
              value: sk-lab
            - name: WEBUI_AUTH
              value: "true"
            - name: DEFAULT_MODELS
              value: lab
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui
  namespace: webui
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  namespace: webui
spec:
  parentRefs:
    - name: lab
      namespace: kube-system
  hostnames:
    - chat.lab.home.arpa
  rules:
    - backendRefs:
        - name: open-webui
          port: 8080
