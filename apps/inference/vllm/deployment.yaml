# Exclusive owner of the 3090. Do not schedule a second nvidia.com/gpu: 1
# pod while this is Running.
#
# Default model is 7B AWQ so the first boot succeeds. Switch MODEL to a 32B
# AWQ/GPTQ instruct checkpoint once smoke tests pass. See docs/04-inference.md.
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: inference
spec:
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # Service "vllm" would inject VLLM_PORT=tcp://... and crash the engine.
      enableServiceLinks: false
      runtimeClassName: nvidia
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.10.2
          args:
            # First-success model. Swap to Qwen/Qwen2.5-32B-Instruct-AWQ (or
            # Qwen3-32B AWQ) once this pod is Ready and you want agent quality.
            - --model
            - Qwen/Qwen2.5-7B-Instruct-AWQ
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --dtype
            - auto
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.90"
            - --download-dir
            - /models
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface
                  key: token
                  optional: true
            - name: HF_HOME
              value: /models
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 4
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: 16
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          hostPath:
            path: /var/mnt/models
            type: DirectoryOrCreate
---
# HTTPRoute is optional; most lab use is in-cluster via LiteLLM.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm
  namespace: inference
spec:
  parentRefs:
    - name: lab
      namespace: kube-system
  hostnames:
    - vllm.lab.home.arpa
  rules:
    - backendRefs:
        - name: vllm
          port: 8000
