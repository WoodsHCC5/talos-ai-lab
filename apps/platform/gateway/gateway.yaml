# Shared Gateway. HTTPRoutes in other namespaces attach via allowedRoutes.
# Request the first address in your LB pool with an annotation if Cilium
# does not assign the one you want:
#   lbipam.cilium.io/ips: "192.168.1.50"
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: lab-ca
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: lab.home.arpa
      tls:
        mode: Terminate
        certificateRefs:
          - name: lab-gateway-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-gateway
  namespace: kube-system
spec:
  secretName: lab-gateway-tls
  issuerRef:
    name: lab-ca
    kind: ClusterIssuer
  dnsNames:
    - lab.home.arpa
    - "*.lab.home.arpa"
