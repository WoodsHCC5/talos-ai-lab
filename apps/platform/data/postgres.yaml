# Shared Postgres for Open WebUI and later Langfuse. Not for kagent —
# kagent ships a bundled Postgres unless you point it at this instance.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: data
type: Opaque
stringData:
  POSTGRES_DB: lab
  POSTGRES_USER: lab
  # Override in-cluster after bootstrap: kubectl -n data create secret generic postgres ...
  POSTGRES_PASSWORD: change-me-on-first-boot
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
spec:
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lab"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
