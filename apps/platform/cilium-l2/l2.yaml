# Cilium answers ARP for LoadBalancer IPs on the LAN.
# Replace the pool with the range from lab.env (LB_IP_POOL) before first apply,
# or create a ConfigMap lab-config in flux-system and use postBuild substitutes.
#
#   apiVersion: v1
#   kind: ConfigMap
#   metadata:
#     name: lab-config
#     namespace: flux-system
#   data:
#     lb_pool: "192.168.1.50-192.168.1.59"
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lab-lan
spec:
  blocks:
    - start: "192.168.1.50"
      stop: "192.168.1.59"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lab-lan
spec:
  loadBalancerIPs: true
  externalIPs: true
  # Empty selectors = all nodes, all LoadBalancer services. Single-node lab.
  nodeSelector: {}
  serviceSelector: {}
